; =============================================================================
; PlatformIO configuration for BatteryManager
; =============================================================================
;
; This configuration enables professional development while keeping full
; compatibility with the classic Arduino IDE (the sketch in BatteryManager/
; can be opened directly).
;
; Key features:
;   - Multiple board targets (uno, nano, pro-mini, etc.)
;   - Automatic library management
;   - Easy CI integration
;   - Same source as the .ino sketch
;
; Usage examples:
;   pio run -e uno                 # Build for Arduino Uno
;   pio run -e nano -t upload      # Build + upload to Nano
;   pio device monitor             # Open serial monitor
;
; When adding new optional features (e.g. OLED), add the corresponding
; libraries under lib_deps in the environments you use.
;
; Note: The src_dir points to the BatteryManager/ folder so that
;       platformio treats the existing .ino + .h files as an Arduino project.
; =============================================================================

[platformio]
; Use the existing Arduino-style sketch folder as source
src_dir = BatteryManager
; Default environment
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Pull in the same Low-Power library that the Arduino version uses
lib_deps = 
    rocketscream/Low-Power
    ; Uncomment below if ENABLE_OLED = 1
    ; adafruit/Adafruit SSD1306@^2.5.7
    ; adafruit/Adafruit GFX Library@^1.11.9
; Extra compiler flags for warnings + modern C++
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DARDUINO=10806
monitor_speed = 115200
monitor_filters = time

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
    rocketscream/Low-Power
    ; Uncomment below if ENABLE_OLED = 1
    ; adafruit/Adafruit SSD1306@^2.5.7
    ; adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
monitor_speed = 115200

[env:nano_old_bootloader]
; Nano with old bootloader (common on cheap clones)
platform = atmelavr
board = nanoatmega328old
framework = arduino
lib_deps = 
    rocketscream/Low-Power
    ; Uncomment below if ENABLE_OLED = 1
    ; adafruit/Adafruit SSD1306@^2.5.7
    ; adafruit/Adafruit GFX Library@^1.11.9
build_flags = -Wall -Wextra -std=gnu++17
monitor_speed = 115200

; Optional: Pro Mini 5V 16MHz (very popular for low-power projects)
[env:pro-mini-5v]
platform = atmelavr
board = pro5v16m
framework = arduino
lib_deps = 
    rocketscream/Low-Power
    ; Uncomment below if ENABLE_OLED = 1
    ; adafruit/Adafruit SSD1306@^2.5.7
    ; adafruit/Adafruit GFX Library@^1.11.9
build_flags = -Wall -Wextra -std=gnu++17
monitor_speed = 115200

; Future-proof: you can easily add an ESP32 supervisor variant later
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; lib_deps = ...

; Profile compile matrix (Uno). Config.h selects lead-acid unless another
; BATTERY_PROFILE_* is passed on the command line.
[env:uno_lifepo4]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DBATTERY_PROFILE_LIFEPO4_4S

[env:uno_liion]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DBATTERY_PROFILE_LIION_4S

; -----------------------------------------------------------------------------
; Host-native Unity tests (no AVR sketch, no Arduino core)
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_src_filter = -<*>
lib_deps =
    throwtheswitch/Unity@^2.6.1
build_flags =
    -DUNIT_TEST
    -DUNITY_INCLUDE_DOUBLE
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -I BatteryManager
    -I BatteryManager/src/core
    -I test/support
    -lm

[env:native_lifepo4]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBATTERY_PROFILE_LIFEPO4_4S

[env:native_liion]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBATTERY_PROFILE_LIION_4S
