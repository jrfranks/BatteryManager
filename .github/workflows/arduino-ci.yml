# =============================================================================
# GitHub Actions — Continuous Integration for BatteryManager
# =============================================================================
# Compiles the Arduino sketch on every push and PR for the most common boards.
# Uses the official arduino-cli setup action for reliability and caching.
#
# This fulfills the "add CI with arduino-cli" suggestion from the project analysis.
# =============================================================================

name: Arduino CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:nano
          - arduino:avr:pro5v16m   # Pro Mini 5V 16 MHz (very common for low-power)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: "latest"

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install required libraries
        run: |
          arduino-cli lib install "Low-Power"

      - name: Compile sketch (BatteryManager folder)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --libraries "$GITHUB_WORKSPACE" \
            --build-path /tmp/arduino-build \
            BatteryManager

      - name: Upload build artifacts (on failure for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ matrix.fqbn }}
          path: /tmp/arduino-build
          retention-days: 7

  # Optional: also verify with PlatformIO when PIO is configured
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO build (uno target)
        run: |
          pio run -e uno -v

      - name: Run PlatformIO build (nano target)
        run: |
          pio run -e nano
