# =============================================================================
# GitHub Actions — Continuous Integration for BatteryManager
# =============================================================================
# Compiles the Arduino sketch on every push and PR for the most common boards,
# runs host-native Unity tests, and builds each battery-profile Uno variant.
# =============================================================================

name: Arduino CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:avr:pro:cpu=16MHzatmega328

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install required libraries
        run: |
          arduino-cli lib install "Low-Power"

      - name: Compile sketch (BatteryManager folder)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --build-path /tmp/arduino-build \
            BatteryManager

      - name: Upload build artifacts (on failure for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ matrix.fqbn }}
          path: /tmp/arduino-build
          retention-days: 7

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO build (uno target)
        run: |
          pio run -e uno -v

      - name: Profile compile matrix (Uno)
        run: |
          pio run -e uno_lifepo4 -e uno_liion

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Host Unity tests (lead-acid default)
        run: pio test -e native

      - name: Host Unity tests (LiFePO4)
        run: pio test -e native_lifepo4

      - name: Host Unity tests (Li-ion)
        run: pio test -e native_liion
